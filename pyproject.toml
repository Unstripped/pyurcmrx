[project]
name = "pyurcmrx"
version = "0.1.0"
description = "Async LAN client for URC Total Control MRX controllers (clean-room, built from open-control-spec)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = ["aiomqtt>=2.5"]

[project.scripts]
pyurcmrx = "pyurcmrx.__main__:main"

[project.urls]
Source = "https://github.com/Unstripped/pyurcmrx"
Issues = "https://github.com/Unstripped/pyurcmrx/issues"
Specification = "https://github.com/Unstripped/open-control-spec"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=1.0", "pyftpdlib>=2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
